<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Material 2 Notes • Note Taking</title>
  
  <!-- Material Design 2 Web Components CSS -->
  <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Roboto Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --mdc-theme-primary: #6200ee;
      --mdc-theme-secondary: #03dac6;
      --mdc-theme-background: #f5f5f5;
      --mdc-theme-surface: #ffffff;
      --mdc-theme-error: #b00020;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--mdc-theme-background);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #212121;
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--mdc-theme-background);
    }

    .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }

    /* Note Card Styles */
    .note-card {
      border-left: 4px solid transparent;
      border-radius: 8px;
      overflow: hidden;
    }

    .note-card.category-work {
      border-left-color: #6200ee;
    }
    .note-card.category-personal {
      border-left-color: #03dac6;
    }
    .note-card.category-ideas {
      border-left-color: #ff7597;
    }
    .note-card.category-tasks {
      border-left-color: #ffb300;
    }

    .note-content-wrapper {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-title {
      font-family: 'Roboto', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.0125em;
      color: #212121;
      word-break: break-word;
    }

    .note-body {
      font-family: 'Roboto', sans-serif;
      font-size: 0.875rem;
      line-height: 1.5;
      color: #424242;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: #757575;
      margin-top: 4px;
    }

    .category-chip {
      background: #f1f3f4;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #424242;
    }

    .note-date {
      flex: 1;
    }

    .fab-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
    }

    /* Dialog Content Styles */
    .dialog-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 24px 20px;
    }

    .mdc-select--filled {
      width: 100%;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      color: #9e9e9e;
      text-align: center;
      gap: 16px;
    }

    .empty-state .material-icons {
      font-size: 64px;
      color: #bdbdbd;
    }

    @media (max-width: 480px) {
      .mdc-dialog .mdc-dialog__surface {
        margin: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Material Top App Bar -->
  <header class="mdc-top-app-bar" id="app-bar">
    <div class="mdc-top-app-bar__row">
      <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start">
        <button class="mdc-icon-button material-icons mdc-top-app-bar__navigation-icon" id="menu-button">menu</button>
        <span class="mdc-top-app-bar__title">Material Notes</span>
      </section>
      <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-end" role="toolbar">
        <button class="mdc-icon-button material-icons mdc-top-app-bar__action-item" id="search-button" aria-label="Search">search</button>
      </section>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Search Field -->
    <div id="search-wrapper" style="display: none;">
      <label class="mdc-text-field mdc-text-field--filled mdc-text-field--no-label mdc-text-field--with-leading-icon mdc-text-field--with-trailing-icon" id="search-text-field">
        <span class="mdc-text-field__ripple"></span>
        <i class="material-icons mdc-text-field__icon mdc-text-field__icon--leading">search</i>
        <input class="mdc-text-field__input" type="text" id="search-input" placeholder="Search notes..." aria-label="Search notes">
        <i class="material-icons mdc-text-field__icon mdc-text-field__icon--trailing" id="clear-search-icon" role="button" tabindex="0" style="cursor: pointer;">close</i>
        <span class="mdc-line-ripple"></span>
      </label>
    </div>

    <!-- Notes Grid -->
    <div class="notes-grid" id="notes-grid">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- FAB -->
  <div class="fab-container">
    <button class="mdc-fab material-icons" id="add-fab" aria-label="Add note">
      <div class="mdc-fab__ripple"></div>
      <span class="mdc-fab__icon">add</span>
    </button>
  </div>

  <!-- Material Dialog -->
  <div class="mdc-dialog" id="note-dialog">
    <div class="mdc-dialog__container">
      <div class="mdc-dialog__surface">
        <h2 class="mdc-dialog__title" id="dialog-title">New Note</h2>
        <div class="dialog-form">
          <!-- Title Field -->
          <label class="mdc-text-field mdc-text-field--filled" id="title-text-field">
            <span class="mdc-text-field__ripple"></span>
            <span class="mdc-floating-label" id="title-label">Title</span>
            <input class="mdc-text-field__input" type="text" id="title-input" maxlength="100" aria-labelledby="title-label">
            <span class="mdc-line-ripple"></span>
          </label>

          <!-- Content Field -->
          <label class="mdc-text-field mdc-text-field--filled mdc-text-field--textarea" id="content-text-field">
            <span class="mdc-text-field__ripple"></span>
            <span class="mdc-floating-label" id="content-label">Content</span>
            <span class="mdc-text-field__resizer">
              <textarea class="mdc-text-field__input" id="content-input" rows="4" aria-labelledby="content-label"></textarea>
            </span>
            <span class="mdc-line-ripple"></span>
          </label>

          <!-- Category Select -->
          <div class="mdc-select mdc-select--filled" id="category-select">
            <div class="mdc-select__anchor" role="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="category-label">
              <span class="mdc-select__ripple"></span>
              <span id="category-label" class="mdc-floating-label">Category</span>
              <span class="mdc-select__selected-text-container">
                <span class="mdc-select__selected-text"></span>
              </span>
              <span class="mdc-select__dropdown-icon">
                <i class="material-icons">arrow_drop_down</i>
              </span>
              <span class="mdc-line-ripple"></span>
            </div>
            <div class="mdc-select__menu mdc-menu mdc-menu-surface mdc-menu-surface--fullwidth">
              <ul class="mdc-list" role="listbox" aria-label="Category list">
                <li class="mdc-list-item mdc-list-item--selected" data-value="personal" role="option" aria-selected="true">
                  <span class="mdc-list-item__text">Personal</span>
                </li>
                <li class="mdc-list-item" data-value="work" role="option">
                  <span class="mdc-list-item__text">Work</span>
                </li>
                <li class="mdc-list-item" data-value="ideas" role="option">
                  <span class="mdc-list-item__text">Ideas</span>
                </li>
                <li class="mdc-list-item" data-value="tasks" role="option">
                  <span class="mdc-list-item__text">Tasks</span>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="mdc-dialog__actions">
          <button type="button" class="mdc-button mdc-dialog__button" data-mdc-dialog-action="cancel">
            <span class="mdc-button__label">Cancel</span>
          </button>
          <button type="button" class="mdc-button mdc-dialog__button" data-mdc-dialog-action="save">
            <span class="mdc-button__label">Save</span>
          </button>
        </div>
      </div>
    </div>
    <div class="mdc-dialog__scrim"></div>
  </div>

  <!-- Material Components Web JS -->
  <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
  
  <script>
    (function() {
      // Wait for MDC to be available
      const mdc = window.mdc;
      
      // ============ STORAGE ============
      const STORAGE_KEY = 'material2_notes_final';
      
      const defaultNotes = [
        {
          id: '1',
          title: 'Welcome to Material Notes',
          content: 'This note-taking app uses official Material Design 2 components. Click + to add a new note!',
          category: 'work',
          createdAt: Date.now() - 200000,
        },
        {
          id: '2',
          title: 'Shopping List',
          content: 'Milk\nBread\nEggs\nAvocado\nCoffee beans',
          category: 'personal',
          createdAt: Date.now() - 100000,
        },
        {
          id: '3',
          title: 'App Ideas',
          content: 'A minimalist journal with voice input and dark theme support.',
          category: 'ideas',
          createdAt: Date.now() - 50000,
        }
      ];

      function loadNotes() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            return parsed.length > 0 ? parsed : [...defaultNotes];
          } catch (e) {
            return [...defaultNotes];
          }
        }
        return [...defaultNotes];
      }

      function saveNotes(notesArray) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notesArray));
      }

      let notes = loadNotes();
      saveNotes(notes);
      
      let editingNoteId = null;
      let searchQuery = '';

      // ============ INITIALIZE MDC COMPONENTS ============
      
      // Top App Bar
      const topAppBarElement = document.getElementById('app-bar');
      const topAppBar = new mdc.topAppBar.MDCTopAppBar(topAppBarElement);
      
      // Search Text Field
      const searchTextFieldElement = document.getElementById('search-text-field');
      const searchTextField = new mdc.textField.MDCTextField(searchTextFieldElement);
      
      // Dialog Text Fields
      const titleTextFieldElement = document.getElementById('title-text-field');
      const titleTextField = new mdc.textField.MDCTextField(titleTextFieldElement);
      
      const contentTextFieldElement = document.getElementById('content-text-field');
      const contentTextField = new mdc.textField.MDCTextField(contentTextFieldElement);
      
      // Category Select
      const categorySelectElement = document.getElementById('category-select');
      const categorySelect = new mdc.select.MDCSelect(categorySelectElement);
      
      // Dialog
      const dialogElement = document.getElementById('note-dialog');
      const dialog = new mdc.dialog.MDCDialog(dialogElement);
      
      // FAB - Using MDCRipple since MDCFab might not be available
      const fabElement = document.getElementById('add-fab');
      const fabRipple = new mdc.ripple.MDCRipple(fabElement);
      
      // Initialize all icon buttons with ripple
      document.querySelectorAll('.mdc-icon-button').forEach(button => {
        const ripple = new mdc.ripple.MDCRipple(button);
        ripple.unbounded = true;
      });

      // ============ DOM ELEMENTS ============
      const notesGrid = document.getElementById('notes-grid');
      const searchWrapper = document.getElementById('search-wrapper');
      const searchInput = document.getElementById('search-input');
      const clearSearchIcon = document.getElementById('clear-search-icon');
      const dialogTitle = document.getElementById('dialog-title');
      const titleInput = document.getElementById('title-input');
      const contentInput = document.getElementById('content-input');
      const menuButton = document.getElementById('menu-button');
      const searchButton = document.getElementById('search-button');

      // ============ FUNCTIONS ============
      
      function filterNotes() {
        if (!searchQuery.trim()) return notes;
        const query = searchQuery.toLowerCase().trim();
        return notes.filter(note => 
          note.title.toLowerCase().includes(query) || 
          note.content.toLowerCase().includes(query) ||
          note.category.toLowerCase().includes(query)
        );
      }

      function formatDate(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        if (diffDays < 7) return `${diffDays}d ago`;
        
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function escapeHtml(text) {
        if (!text) return '';
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
      }

      function renderNotes() {
        const filtered = filterNotes();
        
        if (filtered.length === 0) {
          notesGrid.innerHTML = `
            <div class="empty-state">
              <span class="material-icons">lightbulb_outline</span>
              <p style="font-family: 'Roboto', sans-serif; font-size: 1rem; color: #757575;">
                ${searchQuery ? 'No notes match your search.' : 'No notes yet. Tap + to create one!'}
              </p>
            </div>
          `;
          return;
        }

        let html = '';
        filtered.forEach(note => {
          const categoryClass = `category-${note.category}`;
          const safeTitle = escapeHtml(note.title || 'Untitled');
          const safeContent = escapeHtml(note.content || 'Empty note').replace(/\n/g, '<br>');
          
          html += `
            <div class="mdc-card note-card ${categoryClass}" data-id="${note.id}">
              <div class="note-content-wrapper">
                <div class="note-title">${safeTitle}</div>
                <div class="note-body">${safeContent}</div>
                <div class="note-meta">
                  <span class="category-chip">${note.category}</span>
                  <span class="note-date">${formatDate(note.createdAt)}</span>
                  <button class="mdc-icon-button material-icons edit-btn" data-id="${note.id}" title="Edit note" aria-label="Edit note">edit</button>
                  <button class="mdc-icon-button material-icons delete-btn" data-id="${note.id}" title="Delete note" aria-label="Delete note">delete_outline</button>
                </div>
              </div>
            </div>
          `;
        });
        
        notesGrid.innerHTML = html;
        
        // Initialize ripples on new icon buttons
        notesGrid.querySelectorAll('.mdc-icon-button').forEach(button => {
          const ripple = new mdc.ripple.MDCRipple(button);
          ripple.unbounded = true;
          
          // Add event listeners
          if (button.classList.contains('edit-btn')) {
            button.addEventListener('click', function(e) {
              e.stopPropagation();
              e.preventDefault();
              const id = this.getAttribute('data-id');
              openEditModal(id);
            });
          } else if (button.classList.contains('delete-btn')) {
            button.addEventListener('click', function(e) {
              e.stopPropagation();
              e.preventDefault();
              const id = this.getAttribute('data-id');
              deleteNoteById(id);
            });
          }
        });
      }

      function deleteNoteById(id) {
        if (confirm('Delete this note?')) {
          notes = notes.filter(note => note.id !== id);
          saveNotes(notes);
          renderNotes();
        }
      }

      function openEditModal(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;
        
        editingNoteId = id;
        dialogTitle.textContent = 'Edit Note';
        titleInput.value = note.title;
        contentInput.value = note.content;
        categorySelect.value = note.category;
        
        // Re-layout text fields
        titleTextField.layout();
        contentTextField.layout();
        
        dialog.open();
      }

      function openNewNoteModal() {
        editingNoteId = null;
        dialogTitle.textContent = 'New Note';
        titleInput.value = '';
        contentInput.value = '';
        categorySelect.value = 'personal';
        
        titleTextField.layout();
        contentTextField.layout();
        
        dialog.open();
      }

      function saveNoteFromDialog() {
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const category = categorySelect.value;
        
        if (!title && !content) {
          alert('Please add a title or some content.');
          titleInput.focus();
          return;
        }

        if (editingNoteId) {
          notes = notes.map(note => {
            if (note.id === editingNoteId) {
              return {
                ...note,
                title: title || 'Untitled',
                content: content,
                category: category,
              };
            }
            return note;
          });
        } else {
          const newNote = {
            id: generateId(),
            title: title || 'Untitled',
            content: content,
            category: category,
            createdAt: Date.now(),
          };
          notes = [newNote, ...notes];
        }
        
        saveNotes(notes);
        renderNotes();
      }

      function toggleSearch() {
        if (searchWrapper.style.display === 'none') {
          searchWrapper.style.display = 'block';
          searchTextField.layout();
          setTimeout(() => searchInput.focus(), 100);
        } else {
          searchWrapper.style.display = 'none';
          searchInput.value = '';
          searchQuery = '';
          renderNotes();
        }
      }

      function clearSearch() {
        searchInput.value = '';
        searchQuery = '';
        renderNotes();
        searchInput.focus();
      }

      // ============ EVENT LISTENERS ============
      
      // Menu button
      menuButton.addEventListener('click', function() {
        alert('📝 Material Notes\n\nBuilt with Material Components Web\n\nStore your ideas beautifully.');
      });
      
      // Search button
      searchButton.addEventListener('click', function() {
        toggleSearch();
      });
      
      // Search input
      searchInput.addEventListener('input', function() {
        searchQuery = this.value;
        renderNotes();
      });
      
      // Clear search
      clearSearchIcon.addEventListener('click', function() {
        clearSearch();
      });
      
      // FAB click
      fabElement.addEventListener('click', function() {
        openNewNoteModal();
      });
      
      // Dialog events
      dialog.listen('MDCDialog:opened', function() {
        setTimeout(() => {
          titleInput.focus();
          titleTextField.layout();
          contentTextField.layout();
        }, 150);
      });
      
      dialog.listen('MDCDialog:closed', function(e) {
        if (e.detail.action === 'save') {
          saveNoteFromDialog();
        }
        editingNoteId = null;
      });
      
      // Keyboard shortcut
      contentInput.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          dialog.close('save');
        }
      });

      // ============ INITIAL RENDER ============
      renderNotes();
      console.log('Material Notes app initialized successfully with MDC-Web!');
      
    })();
  </script>
</body>
</html>
