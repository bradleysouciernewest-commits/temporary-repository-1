<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Material 2 Notes • Note Taking</title>
  
  <!-- Material Design 2 Web Components CSS -->
  <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Roboto Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --mdc-theme-primary: #6200ee;
      --mdc-theme-secondary: #03dac6;
      --mdc-theme-background: #f5f5f5;
      --mdc-theme-surface: #ffffff;
      --mdc-theme-error: #b00020;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--mdc-theme-background);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #212121;
      overflow: hidden;
    }

    .mdc-top-app-bar {
      position: relative;
      z-index: 7;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--mdc-theme-background);
    }

    .search-container {
      position: relative;
      margin-bottom: 8px;
    }

    .mdc-text-field {
      width: 100%;
    }

    .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }

    .mdc-card {
      border-radius: 8px;
      border-left: 4px solid transparent;
      transition: box-shadow 0.2s ease;
    }

    .mdc-card.category-work {
      border-left-color: #6200ee;
    }
    .mdc-card.category-personal {
      border-left-color: #03dac6;
    }
    .mdc-card.category-ideas {
      border-left-color: #ff7597;
    }
    .mdc-card.category-tasks {
      border-left-color: #ffb300;
    }

    .note-content-wrapper {
      padding: 16px;
    }

    .note-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: #212121;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .note-body {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #424242;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #757575;
      gap: 12px;
    }

    .note-category-chip {
      background: #f1f3f4;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #424242;
    }

    .note-date {
      flex: 1;
      text-align: center;
    }

    .note-actions {
      display: flex;
      gap: 4px;
    }

    .mdc-icon-button {
      color: #5f6368;
    }

    .fab-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10;
    }

    .mdc-fab {
      background-color: var(--mdc-theme-secondary);
      color: #000000;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      color: #9e9e9e;
      text-align: center;
      gap: 16px;
    }

    .empty-state .material-icons {
      font-size: 64px;
      color: #bdbdbd;
    }

    /* Dialog custom styles */
    .custom-dialog-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .custom-dialog-backdrop.active {
      display: flex;
    }

    .custom-dialog {
      background: white;
      border-radius: 8px;
      padding: 24px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 24px 38px rgba(0,0,0,0.25), 0 10px 20px rgba(0,0,0,0.2);
    }

    .custom-dialog h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 24px;
      color: #212121;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #6200ee;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: none;
      border-bottom: 2px solid #bdbdbd;
      background: #f5f5f5;
      border-radius: 4px 4px 0 0;
      font-family: 'Roboto', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-bottom-color: #6200ee;
      background: #f3e5f5;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .mdc-button {
      font-family: 'Roboto', sans-serif;
    }

    @media (max-width: 480px) {
      .custom-dialog {
        padding: 20px;
        width: 95%;
      }
    }
  </style>
</head>
<body>
  <!-- Material Top App Bar -->
  <header class="mdc-top-app-bar" id="appBar">
    <div class="mdc-top-app-bar__row">
      <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start">
        <button class="mdc-icon-button material-icons mdc-top-app-bar__navigation-icon" id="menuBtn">menu</button>
        <span class="mdc-top-app-bar__title">Material Notes</span>
      </section>
      <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-end">
        <button class="mdc-icon-button material-icons mdc-top-app-bar__action-item" id="searchToggleBtn" aria-label="Search">search</button>
      </section>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Search Field -->
    <div class="search-container" id="searchWrapper" style="display: none;">
      <label class="mdc-text-field mdc-text-field--filled mdc-text-field--no-label">
        <span class="mdc-text-field__ripple"></span>
        <span class="mdc-text-field__leading-icon material-icons">search</span>
        <input class="mdc-text-field__input" type="text" id="searchInput" placeholder="Search notes..." aria-label="Search notes">
        <span class="mdc-line-ripple"></span>
      </label>
    </div>

    <!-- Notes Grid -->
    <div class="notes-grid" id="notesGrid">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- FAB Button -->
  <div class="fab-container">
    <button class="mdc-fab material-icons" id="addNoteFab" aria-label="Add note">
      <span class="mdc-fab__icon">add</span>
    </button>
  </div>

  <!-- Custom Dialog -->
  <div class="custom-dialog-backdrop" id="noteDialog">
    <div class="custom-dialog">
      <h2 id="dialogTitle">New Note</h2>
      
      <div class="form-group">
        <label for="noteTitleInput">Title</label>
        <input type="text" id="noteTitleInput" placeholder="Enter note title" maxlength="80">
      </div>
      
      <div class="form-group">
        <label for="noteContentInput">Content</label>
        <textarea id="noteContentInput" rows="4" placeholder="Write your note..."></textarea>
      </div>
      
      <div class="form-group">
        <label for="noteCategorySelect">Category</label>
        <select id="noteCategorySelect">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="ideas">Ideas</option>
          <option value="tasks">Tasks</option>
        </select>
      </div>
      
      <div class="dialog-actions">
        <button class="mdc-button" id="cancelDialogBtn">
          <span class="mdc-button__label">Cancel</span>
        </button>
        <button class="mdc-button mdc-button--raised" id="saveDialogBtn">
          <span class="mdc-button__label">Save</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Material Design 2 JavaScript -->
  <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
  
  <script>
    (function() {
      // Initialize MDC components
      const mdc = window.mdc;
      
      // Top App Bar
      const topAppBar = new mdc.topAppBar.MDCTopAppBar(document.getElementById('appBar'));
      
      // FAB
      const fab = new mdc.fab.MDCFab(document.getElementById('addNoteFab'));
      
      // Initialize all icon buttons with ripple
      document.querySelectorAll('.mdc-icon-button').forEach(button => {
        const ripple = new mdc.ripple.MDCRipple(button);
        ripple.unbounded = true;
      });
      
      // Initialize text field
      const searchTextField = new mdc.textField.MDCTextField(document.querySelector('.mdc-text-field'));
      
      // Initialize dialog buttons
      const cancelBtn = new mdc.ripple.MDCRipple(document.getElementById('cancelDialogBtn'));
      const saveBtn = new mdc.ripple.MDCRipple(document.getElementById('saveDialogBtn'));
      
      // STORAGE
      const STORAGE_KEY = 'material2_notes_app_v3';
      
      const defaultNotes = [
        {
          id: '1',
          title: 'Welcome to Material Notes',
          content: 'This note-taking app uses Material Design 2 with proper components. Click + to add a new note!',
          category: 'work',
          createdAt: Date.now() - 200000,
        },
        {
          id: '2',
          title: 'Shopping list',
          content: 'Milk, bread, eggs, avocado, coffee beans.',
          category: 'personal',
          createdAt: Date.now() - 100000,
        },
        {
          id: '3',
          title: 'App idea',
          content: 'A minimalist journal with voice input and dark theme support.',
          category: 'ideas',
          createdAt: Date.now() - 50000,
        }
      ];

      function loadNotes() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            return JSON.parse(stored);
          } catch (e) {
            return defaultNotes;
          }
        }
        return defaultNotes;
      }

      function saveNotes(notes) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      let notes = loadNotes();
      if (!notes.length) {
        notes = defaultNotes;
        saveNotes(notes);
      }

      let editingNoteId = null;
      let searchQuery = '';

      // DOM Elements
      const notesGrid = document.getElementById('notesGrid');
      const searchWrapper = document.getElementById('searchWrapper');
      const searchInput = document.getElementById('searchInput');
      const searchToggleBtn = document.getElementById('searchToggleBtn');
      const noteDialog = document.getElementById('noteDialog');
      const dialogTitle = document.getElementById('dialogTitle');
      const noteTitleInput = document.getElementById('noteTitleInput');
      const noteContentInput = document.getElementById('noteContentInput');
      const noteCategorySelect = document.getElementById('noteCategorySelect');

      // Filter notes
      function filterNotes() {
        if (!searchQuery.trim()) return notes;
        const query = searchQuery.toLowerCase().trim();
        return notes.filter(note => 
          note.title.toLowerCase().includes(query) || 
          note.content.toLowerCase().includes(query) ||
          note.category.toLowerCase().includes(query)
        );
      }

      function formatDate(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        if (diffDays < 7) return `${diffDays}d ago`;
        
        return date.toLocaleDateString('en-US', { 
          month: 'short', 
          day: 'numeric'
        });
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Render notes
      function renderNotes() {
        const filtered = filterNotes();
        
        if (filtered.length === 0) {
          notesGrid.innerHTML = `
            <div class="empty-state">
              <span class="material-icons">lightbulb_outline</span>
              <p style="font-size: 1rem; color: #757575;">${searchQuery ? 'No notes match your search.' : 'No notes yet. Tap + to create one.'}</p>
            </div>
          `;
          return;
        }

        let html = '';
        filtered.forEach(note => {
          const categoryClass = `category-${note.category}`;
          const safeTitle = escapeHtml(note.title || 'Untitled');
          const safeContent = escapeHtml(note.content || 'Empty note...').replace(/\n/g, '<br>');
          
          html += `
            <div class="mdc-card ${categoryClass}" data-id="${note.id}">
              <div class="note-content-wrapper">
                <div class="note-title">${safeTitle}</div>
                <div class="note-body">${safeContent}</div>
                <div class="note-meta">
                  <span class="note-category-chip">${note.category}</span>
                  <span class="note-date">${formatDate(note.createdAt)}</span>
                  <div class="note-actions">
                    <button class="mdc-icon-button material-icons edit-note-btn" data-id="${note.id}" aria-label="Edit note" title="Edit">edit</button>
                    <button class="mdc-icon-button material-icons delete-note-btn" data-id="${note.id}" aria-label="Delete note" title="Delete">delete_outline</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
        
        notesGrid.innerHTML = html;
        
        // Re-initialize icon buttons with ripple
        document.querySelectorAll('.mdc-icon-button').forEach(button => {
          const ripple = new mdc.ripple.MDCRipple(button);
          ripple.unbounded = true;
        });
        
        // Add event listeners
        document.querySelectorAll('.edit-note-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.getAttribute('data-id');
            openEditModal(id);
          });
        });
        
        document.querySelectorAll('.delete-note-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.getAttribute('data-id');
            deleteNoteById(id);
          });
        });
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
      }

      function deleteNoteById(id) {
        if (confirm('Delete this note?')) {
          notes = notes.filter(note => note.id !== id);
          saveNotes(notes);
          renderNotes();
        }
      }

      function openEditModal(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;
        editingNoteId = id;
        dialogTitle.textContent = 'Edit Note';
        noteTitleInput.value = note.title;
        noteContentInput.value = note.content;
        noteCategorySelect.value = note.category;
        openDialog();
      }

      function openNewNoteModal() {
        editingNoteId = null;
        dialogTitle.textContent = 'New Note';
        noteTitleInput.value = '';
        noteContentInput.value = '';
        noteCategorySelect.value = 'personal';
        openDialog();
      }

      function openDialog() {
        noteDialog.classList.add('active');
        setTimeout(() => noteTitleInput.focus(), 100);
      }

      function closeDialog() {
        noteDialog.classList.remove('active');
        editingNoteId = null;
      }

      function saveNoteFromDialog() {
        const title = noteTitleInput.value.trim();
        const content = noteContentInput.value.trim();
        const category = noteCategorySelect.value;
        
        if (!title && !content) {
          alert('Please add a title or some content.');
          noteTitleInput.focus();
          return;
        }

        if (editingNoteId) {
          notes = notes.map(note => {
            if (note.id === editingNoteId) {
              return {
                ...note,
                title: title || 'Untitled',
                content: content,
                category: category,
              };
            }
            return note;
          });
        } else {
          const newNote = {
            id: generateId(),
            title: title || 'Untitled',
            content: content,
            category: category,
            createdAt: Date.now(),
          };
          notes = [newNote, ...notes];
        }
        
        saveNotes(notes);
        closeDialog();
        renderNotes();
      }

      // Search functions
      function toggleSearch() {
        if (searchWrapper.style.display === 'none' || !searchWrapper.style.display) {
          searchWrapper.style.display = 'block';
          searchInput.focus();
        } else {
          searchWrapper.style.display = 'none';
          searchInput.value = '';
          searchQuery = '';
          renderNotes();
        }
      }

      function performSearch() {
        searchQuery = searchInput.value;
        renderNotes();
      }

      // Event Listeners
      searchToggleBtn.addEventListener('click', toggleSearch);
      
      searchInput.addEventListener('input', performSearch);
      
      document.getElementById('addNoteFab').addEventListener('click', openNewNoteModal);
      
      document.getElementById('cancelDialogBtn').addEventListener('click', closeDialog);
      
      document.getElementById('saveDialogBtn').addEventListener('click', saveNoteFromDialog);
      
      // Close dialog on backdrop click
      noteDialog.addEventListener('click', function(e) {
        if (e.target === noteDialog) {
          closeDialog();
        }
      });
      
      // Close dialog on Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && noteDialog.classList.contains('active')) {
          closeDialog();
        }
      });
      
      // Save on Enter in title field
      noteTitleInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          noteContentInput.focus();
        }
      });
      
      // Menu button
      document.getElementById('menuBtn').addEventListener('click', function() {
        alert('Material Notes\nBuilt with Material Design 2\n\nStore your ideas beautifully.');
      });
      
      // Initial render
      renderNotes();
    })();
  </script>
</body>
</html>
